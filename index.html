<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gửi Trọn Yêu Thương - 20/10 🌸</title>

  <!-- Cấu hình PWA & Mobile -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chúc 20/10">

  <!-- Tailwind CSS & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Montserrat', sans-serif; }
    .font-cursive { font-family: 'Dancing Script', cursive; }
    
    /* Hiệu ứng chuyển cảnh nhẹ nhàng */
    .fade-in { animation: fadeIn 0.5s ease-in-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Style riêng cho nút được chọn */
    .btn-selected {
      background-color: #fce7f3 !important; /* bg-rose-100 */
      border-color: #f43f5e !important;     /* border-rose-500 */
      color: #e11d48 !important;          /* text-rose-600 */
    }
  </style>
</head>
<body class="bg-rose-50 text-gray-800 min-h-screen p-4 flex items-center justify-center">

  <!-- Hiệu ứng nền Canvas: Cánh hoa falling -->
  <canvas id="canvas-petals" class="fixed top-0 left-0 w-full h-full pointer-events-none z-0"></canvas>

  <main class="w-full max-w-md bg-white p-6 md:p-8 rounded-3xl shadow-xl border border-rose-100 relative z-10 transition-all duration-300">
    
    <!-- TIÊU ĐỀ -->
    <header class="text-center mb-6">
      <h1 class="text-3xl font-bold text-rose-600 font-cursive">Gửi Trọn Yêu Thương</h1>
      <p class="text-sm font-semibold text-rose-400">CHÚC MỪNG NGÀY PHỤ NỮ VIỆT NAM 20/10</p>
    </header>

    <!-- MÀN HÌNH 1: NHẬP THÔNG TIN & CHỌN ĐỐI TƯỢNG -->
    <div id="screen-setup" class="space-y-5 fade-in">
      
      <!-- Nhập tên bạn -->
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1.5 ml-1">BƯỚC 1: NHẬP TÊN BẠN</label>
        <input type="text" id="sender-name" placeholder="Ví dụ: Nguyễn Văn A..." class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-300 transition shadow-inner">
      </div>

      <!-- Chọn đối tượng -->
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-2.5 ml-1">BƯỚC 2: CHỌN ĐỐI TƯỢNG</label>
        <div class="grid grid-cols-2 gap-3">
          <button onclick="selectCategory('mom')" id="btn-mom" class="category-btn p-3.5 bg-gray-50 border border-gray-200 rounded-2xl text-sm font-semibold text-gray-700 hover:bg-rose-50 hover:border-rose-300 transition flex items-center gap-2.5">
            👩‍👦 Mẹ Yêu
          </button>
          <button onclick="selectCategory('lover')" id="btn-lover" class="category-btn p-3.5 bg-gray-50 border border-gray-200 rounded-2xl text-sm font-semibold text-gray-700 hover:bg-rose-50 hover:border-rose-300 transition flex items-center gap-2.5">
            💖 Người Yêu
          </button>
          <!-- DANH MỤC CHỊ/EM GÁI MỚI -->
          <button onclick="selectCategory('sister')" id="btn-sister" class="category-btn p-3.5 bg-gray-50 border border-gray-200 rounded-2xl text-sm font-semibold text-gray-700 hover:bg-rose-50 hover:border-rose-300 transition flex items-center gap-2.5">
            💃 Chị/Em Gái
          </button>
          <button onclick="selectCategory('teacher')" id="btn-teacher" class="category-btn p-3.5 bg-gray-50 border border-gray-200 rounded-2xl text-sm font-semibold text-gray-700 hover:bg-rose-50 hover:border-rose-300 transition flex items-center gap-2.5">
            👩‍🏫 Cô Giáo
          </button>
          <button onclick="selectCategory('friend')" id="btn-friend" class="category-btn p-3.5 bg-gray-50 border border-gray-200 rounded-2xl text-sm font-semibold text-gray-700 hover:bg-rose-50 hover:border-rose-300 transition flex items-center gap-2.5 col-span-2">
            🌷 Bạn Bè / Đồng Nghiệp
          </button>
        </div>
      </div>

      <!-- Nút Tạo lời chúc -->
      <button onclick="generateWish()" class="w-full py-4 bg-rose-600 text-white rounded-2xl font-bold text-base shadow-lg hover:bg-rose-700 active:scale-95 transition-all">
        TẠO LỜI CHÚC NGAY ✨
      </button>
    </div>

    <!-- MÀN HÌNH 2: HIỂN THỊ THIỆP -->
    <div id="screen-card" class="hidden space-y-5 fade-in">
      
      <!-- Thiệp chúc mừng -->
      <div id="wish-card" class="bg-gradient-to-br from-rose-50 to-white border-4 border-rose-200 rounded-3xl p-6 text-center shadow-lg relative overflow-hidden transition-all duration-300">
        <div class="text-4xl mb-3">🌸</div>
        <h2 id="card-header" class="text-2xl font-bold text-rose-600 font-cursive mb-4">Mừng Ngày 20/10!</h2>
        
        <p id="card-message" class="text-gray-700 text-sm leading-relaxed italic min-h-[120px] flex items-center justify-center px-2">
          "Lời chúc sẽ xuất hiện ở đây..."
        </p>

        <div class="mt-5 pt-3 border-t border-rose-200/60 flex items-center justify-between text-xs text-rose-500 font-bold">
          <span id="card-to">Gửi: Chị Gái</span>
          <span id="card-from">Từ: [Tên bạn]</span>
        </div>
      </div>

      <!-- Các nút thao tác -->
      <div class="grid grid-cols-2 gap-3">
        <button onclick="generateWish()" class="py-3 px-4 bg-white border border-rose-30
